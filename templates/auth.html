<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow – Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
  <main class="auth-wrap">
    <section class="auth-intro">
      <h1>TaskFlow</h1>
      <p>Write it down, do it, tick it off. A simple place to keep track of assignments, labs and everything else on your plate.</p>
      <ul>
        <li>Priorities and due dates</li>
        <li>Categories like College, Home, Projects</li>
        <li>Search, filter and progress tracking</li>
      </ul>
    </section>

    <section class="auth-card">
      <div class="tabs" role="tablist">
        <button class="tab active" id="tab-login" role="tab" aria-selected="true">Log in</button>
        <button class="tab" id="tab-register" role="tab" aria-selected="false">Create account</button>
      </div>

      <div id="auth-error" class="alert" role="alert" hidden></div>

      <form id="login-form" autocomplete="on">
        <label>Email <input type="email" name="email" required autocomplete="email"></label>
        <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
        <button class="btn primary wide" type="submit">Log in</button>
      </form>

      <form id="register-form" autocomplete="on" hidden>
        <label>Name <input type="text" name="name" required minlength="2" autocomplete="name"></label>
        <label>Email <input type="email" name="email" required autocomplete="email"></label>
        <label>Password <input type="password" name="password" required minlength="6" autocomplete="new-password"></label>
        <button class="btn primary wide" type="submit">Create account</button>
      </form>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
